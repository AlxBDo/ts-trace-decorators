name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Node >= 22 is required by the test runner glob patterns.
        # The published library itself only needs Node >= 18.
        node: ['22.x', '24.x']
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `dist/` is not versioned: the build runs here, from source.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Contract tests
        run: npm run test:contract

  package:
    name: Package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # Exercises `prepublishOnly` (clean + build) exactly as `npm publish` would.
      - name: Verify publishable tarball
        run: npm pack --dry-run
